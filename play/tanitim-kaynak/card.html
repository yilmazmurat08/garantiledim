<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(poppins_bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(poppins_semibold.ttf);font-weight:600}
@font-face{font-family:P;src:url(poppins_medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(poppins_regular.ttf);font-weight:400}
html,body{margin:0}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:P;color:#F7F2FF;
 background:linear-gradient(170deg,#2A1747 0%,#1C0D33 45%,#150A27 100%)}
.g1{position:absolute;width:900px;height:900px;border-radius:50%;left:-300px;top:-260px;background:radial-gradient(circle,#FF7AB855,transparent 65%)}
.g2{position:absolute;width:1000px;height:1000px;border-radius:50%;right:-420px;bottom:-200px;background:radial-gradient(circle,#A78BFA44,transparent 65%)}
.kick{position:absolute;top:118px;left:0;right:0;text-align:center}
.kick span{display:inline-block;font-weight:600;font-size:30px;letter-spacing:4px;text-transform:uppercase;color:#2A0F3D;background:#FF7AB8;padding:10px 26px;border-radius:999px}
h1{position:absolute;top:200px;left:70px;right:70px;margin:0;text-align:center;font-weight:700;font-size:88px;line-height:1.08;letter-spacing:-1.5px}
h1 em{font-style:normal;background:linear-gradient(90deg,#FF7AB8,#C4AAFA);-webkit-background-clip:text;color:transparent}
p{position:absolute;top:var(--pt);left:110px;right:110px;margin:0;text-align:center;font-weight:400;font-size:40px;line-height:1.4;color:#C7B6E6}
.phone{position:absolute;left:50%;top:var(--ft);transform:translateX(-50%);width:640px;height:1422px;border-radius:78px;background:#0E0619;
 padding:18px;box-sizing:border-box;box-shadow:0 0 0 3px #4A3270,0 40px 120px #000a,0 0 140px #FF7AB833}
.phone img{width:100%;height:100%;border-radius:62px;object-fit:cover;object-position:top;display:block}
.notch{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #1a1030}
</style></head><body><div class="c" id="c"><div class="g1"></div><div class="g2"></div>
<div class="kick"><span id="k"></span></div><h1 id="h"></h1><p id="s"></p>
<div class="phone" id="ph"><img id="im"><div class="notch"></div></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('k').textContent=q.get('k');
document.getElementById('h').innerHTML=q.get('h');
document.getElementById('s').textContent=q.get('s');
document.getElementById('im').src='shots/'+q.get('img');
document.fonts.ready.then(()=>{
const hb=document.getElementById('h').getBoundingClientRect().bottom;
const sp=document.getElementById('s'); sp.style.setProperty('--pt',(hb+30)+'px');
const sb=sp.getBoundingClientRect().bottom;
const top=sb+60, h=Math.min(1422,1920-top-70);
const ph=document.getElementById('ph');
ph.style.setProperty('--ft',top+'px'); ph.style.height=h+'px'; ph.style.width=Math.round(h*0.45)+'px';
ph.style.borderRadius=Math.round(h*0.055)+'px';
document.body.dataset.ready='1';
});
</script></body></html>
