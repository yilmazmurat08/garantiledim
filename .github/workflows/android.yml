name: Android

on:
  push:
    branches: [main, ccr-38695d75-1p1qgi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle, test et, APK yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri ve derleme
        run: ./gradlew --continue testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde ekran turu ve release açılış testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh

      - name: Ekran görüntülerini ci-screenshots dalına yaz
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cp -r app/build/reports ci-out/reports 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Derleme ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: APK'yı test-latest sürümüne yükle
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk garantiledim.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest garantiledim.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Garantiledim test sürümü 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Telefona doğrudan kurulabilen test APK'sı (derleme ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7}). Play Store sürümü değildir."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garantiledim-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            ci-out/
          if-no-files-found: ignore
